<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React 18 Render Slicing Test</title>
    <style>
      html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; }
      #root { padding: 12px; }
      button { padding: 8px 16px; font-size: 14px; margin-right: 8px; }
      .grid { display: grid; grid-template-columns: repeat(25, 1fr); gap: 2px; margin-top: 12px; }
      .cell { font-size: 10px; padding: 2px; background: #eef; text-align: center; }
      .cell.dirty { background: #fed; }
      .toolbar { position: sticky; top: 0; background: #fff; padding: 8px 0; border-bottom: 1px solid #ddd; }
      .stat { font-family: monospace; margin-left: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
